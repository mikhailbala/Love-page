<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Love Page</title>

<style>
body {
  margin: 0;
  background: black;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: Georgia, serif;
}

.heart {
  position: relative;
  width: 200px;
  height: 200px;
  background: red;
  transform: rotate(-45deg);
  animation: pulse 1.5s infinite;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 200px;
  height: 200px;
  background: red;
  border-radius: 50%;
}

.heart::before {
  top: -100px;
  left: 0;
}

.heart::after {
  left: 100px;
  top: 0;
}

@keyframes pulse {
  0% { transform: rotate(-45deg) scale(1); }
  50% { transform: rotate(-45deg) scale(1.1); }
  100% { transform: rotate(-45deg) scale(1); }
}

h1 {
  color: white;
  margin-top: 40px;
  font-size: 28px;
}
  .photo {
  width: 600px;
  border-radius: 20px;
  margin-top: 30px;
}
</style>
</head>

<body>

<div class="heart"></div>
  <img src="photo.JPG" class="photo">
<h1>I love you ❤️</h1>

</body>
</html>
